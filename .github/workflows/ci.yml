name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: catch drift against the newest IPT release
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    # New advisories land against an unchanged lockfile, so the nightly run only warns (Dependabot opens the fix);
    # pushes and pull requests still fail on them.
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || { echo "::warning::npm audit found high-severity advisories"; exit 1; }

  integration:
    # Real IPT (official release WAR on the official Tomcat image), TEST mode, disposable data dir.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ipt: ["3.3.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve IPT version
        id: v
        run: |
          V="${{ matrix.ipt }}"
          if [ "$V" = latest ]; then
            V=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 https://repository.gbif.org/repository/releases/org/gbif/ipt/maven-metadata.xml | sed -n 's|.*<release>\(.*\)</release>.*|\1|p')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ipt-mcp
          key: ipt-war-${{ steps.v.outputs.version }}
      - run: harness/fetch-war.sh "${{ steps.v.outputs.version }}" ~/.cache/ipt-mcp/ipt-${{ steps.v.outputs.version }}.war
      - run: IPT_WAR=~/.cache/ipt-mcp/ipt-${{ steps.v.outputs.version }}.war harness/start-ipt.sh
      - run: harness/setup-ipt.sh
      - run: npm run test:integration
        env:
          IPT_TEST_URL: http://localhost:18080/ipt
      - if: failure()
        run: docker logs ipt-test | tail -200
